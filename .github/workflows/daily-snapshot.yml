name: Daily Snapshot

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-snapshot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Create snapshot script
        run: |
          cat > create-snapshot.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const API_BASE = 'https://api.realdutch.club';
          
          async function fetchCombinedData() {
            const response = await fetch(`${API_BASE}/api/combined-data`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
          }
          
          async function fetchClub(tag) {
            const response = await fetch(`${API_BASE}/api/club?tag=${tag}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
          }
          
          async function updateManifest(filename) {
            const manifestPath = path.join('clubs', 'snapshots.json');
            let snapshots = [];
            
            if (fs.existsSync(manifestPath)) {
              const manifestContent = fs.readFileSync(manifestPath, 'utf8');
              try {
                const manifest = JSON.parse(manifestContent);
                snapshots = manifest.snapshots || [];
              } catch (err) {
                console.log('⚠️ Bestaand manifest kon niet worden gelezen, nieuw manifest wordt aangemaakt');
              }
            }
            
            if (!snapshots.includes(filename)) {
              snapshots.push(filename);
              snapshots.sort();
              
              const newManifest = { snapshots: snapshots };
              fs.writeFileSync(manifestPath, JSON.stringify(newManifest, null, 2));
              console.log(`✅ Manifest bijgewerkt met: ${filename}`);
            } else {
              console.log(`ℹ️ ${filename} staat al in manifest`);
            }
          }
          
          async function createSnapshot() {
            console.log('📸 Creating daily snapshot...');
            
            const combinedData = await fetchCombinedData();
            const clubsData = [];
            
            for (const club of combinedData.clubs) {
              console.log(`Fetching live data for ${club.name}...`);
              const liveClub = await fetchClub(club.tag);
              
              const membersWithStats = liveClub.members.map(member => {
                const statsMember = club.members?.find(sm => sm.tag === member.tag);
                return {
                  rank: liveClub.members.findIndex(x => x.tag === member.tag) + 1,
                  name: member.name,
                  tag: member.tag,
                  trophies: member.trophies,
                  prestige: statsMember?.prestige || 0,
                  role: member.role,
                  teamWins: statsMember?.teamWins || 0,
                  showdownWins: statsMember?.showdownWins || 0,
                  ratio: statsMember?.ratio || '0',
                  inDiscord: statsMember?.inDiscord || false,
                  discordName: statsMember?.discordName || null,
                  onKickList: statsMember?.onKickList || false
                };
              });
              
              clubsData.push({
                name: liveClub.name,
                tag: liveClub.tag,
                totalTrophies: liveClub.trophies,
                requiredTrophies: liveClub.requiredTrophies || 0,
                members: membersWithStats
              });
            }
            
            const snapshot = {
              date: new Date().toISOString(),
              clubs: clubsData
            };
            
            const dateStr = new Date().toISOString().split('T')[0];
            const filename = `snapshot_${dateStr}.json`;
            const filePath = path.join('clubs', filename);
            
            fs.mkdirSync('clubs', { recursive: true });
            fs.writeFileSync(filePath, JSON.stringify(snapshot, null, 2));
            
            console.log(`✅ Snapshot saved to ${filePath}`);
            
            await updateManifest(filename);
            
            return { filename, filePath };
          }
          
          createSnapshot()
            .then(() => process.exit(0))
            .catch(err => {
              console.error('❌ Error creating snapshot:', err);
              process.exit(1);
            });
          EOF
          
      - name: Run snapshot creation
        run: node create-snapshot.js

      # 👇 NIEUW: genereer players_YYYY-MM-DD.json + players-latest.json
      - name: Create players builder script
        run: |
          cat > build-players.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const SNAPSHOT_DIR = 'clubs';
          const OUTPUT_DIR   = 'clubs';
          const LATEST_NAME  = 'players-latest.json';

          function listSnapshots(dir) {
            return fs.readdirSync(dir)
              .filter(f => /^snapshot_(\d{4}-\d{2}-\d{2})\.json$/.test(f))
              .map(f => {
                const m = f.match(/^snapshot_(\d{4}-\d{2}-\d{2})\.json$/);
                return { filename: f, date: m[1] };
              })
              .sort((a, b) => new Date(a.date) - new Date(b.date));
          }

          function buildPlayersJson(snapshots) {
            const players = {};

            for (const snap of snapshots) {
              const fullPath = path.join(SNAPSHOT_DIR, snap.filename);
              const data = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
              if (!data.clubs) continue;

              for (const club of data.clubs) {
                if (!club.members) continue;
                for (const m of club.members) {
                  if (!m.tag) continue;

                  if (!players[m.tag]) players[m.tag] = [];

                  const last = players[m.tag][players[m.tag].length - 1];
                  if (last && last.date === snap.date) continue;

                  players[m.tag].push({
                    date: snap.date,
                    trophies: m.trophies ?? 0,
                    prestige: m.prestige ?? 0,
                    teamWins: m.teamWins ?? 0,
                    showdownWins: m.showdownWins ?? 0,
                    club: club.name
                  });
                }
              }
            }

            for (const tag in players) {
              players[tag].sort((a, b) => new Date(a.date) - new Date(b.date));
            }

            return players;
          }

          function main() {
            if (!fs.existsSync(SNAPSHOT_DIR)) {
              console.error('❌ Map niet gevonden:', SNAPSHOT_DIR);
              process.exit(1);
            }

            const snapshots = listSnapshots(SNAPSHOT_DIR);
            if (snapshots.length === 0) {
              console.error('❌ Geen snapshots gevonden in', SNAPSHOT_DIR);
              process.exit(1);
            }

            const players = buildPlayersJson(snapshots);
            const today = snapshots[snapshots.length - 1].date;

            const output = {
              generatedAt: new Date().toISOString(),
              snapshotCount: snapshots.length,
              playerCount: Object.keys(players).length,
              players: players
            };

            const json = JSON.stringify(output, null, 2);

            if (!fs.existsSync(OUTPUT_DIR)) fs.mkdirSync(OUTPUT_DIR, { recursive: true });

            const datedName = `players_${today}.json`;
            fs.writeFileSync(path.join(OUTPUT_DIR, datedName), json);
            console.log(`✅ ${datedName} (${Object.keys(players).length} spelers uit ${snapshots.length} snapshots)`);

            fs.writeFileSync(path.join(OUTPUT_DIR, LATEST_NAME), json);
            console.log(`✅ ${LATEST_NAME}`);
          }

          main();
          EOF

      - name: Build players.json files
        run: node build-players.js
          
      - name: Commit and push snapshot
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add clubs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "📸 Daily snapshot $(date +'%Y-%m-%d')" && git push)
